---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gateway
  namespace: istio-system
  annotations:
    # Configure the gateway service to use LoadBalancer
    networking.istio.io/service-type: "LoadBalancer"
    external-dns.alpha.kubernetes.io/hostname: "*.lbrightlab.com"
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: "*.lbrightlab.com"
      allowedRoutes:
        namespaces:
          from: All
    - name: https-keycloak
      port: 443
      protocol: HTTPS
      hostname: "keycloak.lbrightlab.com"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: keycloak-cert
            kind: Secret
            namespace: keycloak
    - name: https-grafana
      port: 443
      protocol: HTTPS
      hostname: "grafana.lbrightlab.com"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: grafana-cert
            kind: Secret
            namespace: observability
    - name: https-prometheus
      port: 443
      protocol: HTTPS
      hostname: "prometheus.lbrightlab.com"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: prometheus-cert
            kind: Secret
            namespace: observability
    - name: https-loki
      port: 443
      protocol: HTTPS
      hostname: "loki.lbrightlab.com"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: loki-cert
            kind: Secret
            namespace: observability
    - name: https-tempo
      port: 443
      protocol: HTTPS
      hostname: "tempo.lbrightlab.com"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: tempo-cert
            kind: Secret
            namespace: observability
    - name: https-alloy
      port: 443
      protocol: HTTPS
      hostname: "alloy.lbrightlab.com"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: alloy-cert
            kind: Secret
            namespace: observability
    - name: https-minio
      port: 443
      protocol: HTTPS
      hostname: "minio.lbrightlab.com"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: minio-cert
            kind: Secret
            namespace: minio
    - name: https-minio-console
      port: 443
      protocol: HTTPS
      hostname: "minio-console.lbrightlab.com"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: minio-console-cert
            kind: Secret
            namespace: minio
    - name: https-neuvector
      port: 443
      protocol: HTTPS
      hostname: "neuvector.lbrightlab.com"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: neuvector-cert
            kind: Secret
            namespace: neuvector
