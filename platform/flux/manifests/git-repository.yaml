# Flux GitRepository - Points to this repository
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: brightlab
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/lovertbright/brightlab.git
  ref:
    branch: main
  ignore: |
    # Ignore non-manifest files
    .git/
    .gitignore
    .yamllint
    README.md
    docs/
    scripts/
    infrastructure/
    node_modules/
    Taskfile.yml
    *.md
